<style>
/* Layout: one column like a church bulletin; fixed bottom tabs. Tokens shared with Logos. */
:root{
  --bg:#eef0eb; --surface:#fafaf6; --ink:#1c2333; --muted:#596170; --line:#d6d9cf;
  --accent:#2d5c4f; --accent-soft:#dce8e2; --gold:#9a6d22; --gold-soft:#f2e7d2;
  --study:#2d5c4f; --sermon:#7a4a1f; --news:#3b5579; --danger:#a23b2c; --danger-soft:#f6e1dc;
  --f-display:"Cinzel",Georgia,serif; --f-body:"Literata",Georgia,serif; --f-ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#181e27; --ink:#e7e3d8; --muted:#9ba2ae; --line:#2b323d;
  --accent:#86b9a6; --accent-soft:#1f3530; --gold:#d8ad5f; --gold-soft:#3a2f1c;
  --study:#86b9a6; --sermon:#d9a066; --news:#8fb0d9; --danger:#e08a7a; --danger-soft:#3a1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#181e27; --ink:#e7e3d8; --muted:#9ba2ae; --line:#2b323d;
  --accent:#86b9a6; --accent-soft:#1f3530; --gold:#d8ad5f; --gold-soft:#3a2f1c;
  --study:#86b9a6; --sermon:#d9a066; --news:#8fb0d9; --danger:#e08a7a; --danger-soft:#3a1f1b; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:1rem;color:var(--accent)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;letter-spacing:.02em;line-height:1.15}
.serif{font-family:var(--f-body)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.link.danger{color:var(--danger)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;background:var(--surface);cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid currentColor}
.tag.study{color:var(--study)} .tag.sermon{color:var(--sermon)} .tag.news{color:var(--news)} .tag.pin{color:var(--gold)} .tag.leaders{color:var(--gold)} .tag.answered{color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500}
.field{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 13px;font-size:16px}
textarea.field{min-height:120px;resize:vertical;font-family:var(--f-body)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;box-sizing:border-box}
.card h3{font-family:var(--f-body);font-weight:600;font-size:1.15rem}
.card .excerpt{font-family:var(--f-body);color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.body{font-family:var(--f-body);font-size:1.03rem;line-height:1.7;display:flex;flex-direction:column;gap:12px;max-width:65ch;overflow-wrap:anywhere}
.comment{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.comment p{font-family:var(--f-body);overflow-wrap:anywhere}
.prayer{display:flex;flex-direction:column;gap:8px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:.85rem;margin-bottom:12px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:.88rem}
.ok{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 14px;font-size:.88rem}
.member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:.65rem;padding:1px 6px;margin-left:4px;font-weight:700}
audio{width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button[aria-current="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:10}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
</style>
<style>
.logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.logo.big{width:84px;height:84px;border-radius:18px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:var(--surface);padding:4px 10px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.tagline{font-family:var(--f-body);font-style:italic;color:var(--gold)}
</style>
<style>
/* AGS Jubelate palette, taken from the church logo: red figures, charcoal cross */
:root{--bg:#f4f1ef;--surface:#fffdfb;--ink:#26221f;--muted:#6b6560;--line:#e3dcd7;--accent:#a42f29;--accent-soft:#f6e2df;--gold:#575759;--gold-soft:#ecebee;--study:#a42f29;--sermon:#575759;--news:#2f5d7c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151314;--surface:#1f1c1d;--ink:#ece6e2;--muted:#a59e99;--line:#332e2f;--accent:#e2766c;--accent-soft:#3b1f1c;--gold:#bdbac0;--gold-soft:#2a292c;--study:#e2766c;--sermon:#bdbac0;--news:#8fb6d6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151314;--surface:#1f1c1d;--ink:#ece6e2;--muted:#a59e99;--line:#332e2f;--accent:#e2766c;--accent-soft:#3b1f1c;--gold:#bdbac0;--gold-soft:#2a292c;--study:#e2766c;--sermon:#bdbac0;--news:#8fb6d6;color-scheme:dark}
.contact a{word-break:break-word}
/* Larger, easier defaults for older eyes and hands; members can make text bigger still */
html{font-size:17px}
html[data-size="1"]{font-size:19px}
html[data-size="2"]{font-size:21.5px}
body{font-size:1rem!important;line-height:1.6!important}
.btn{min-height:48px;padding:10px 18px!important;font-size:1rem}
.chip{min-height:40px;padding:8px 16px!important;font-size:.95rem!important}
.field{font-size:max(16px,1rem)!important;padding:13px 14px!important}
.small{font-size:.9rem!important}
.eyebrow{font-size:.78rem!important}
.tag{font-size:.74rem!important}
.link{min-height:40px;font-size:1rem}
.tabs button{font-size:min(.8rem,14px)!important;padding:10px 2px 10px!important;min-height:64px}
.tabs svg{width:28px!important;height:28px!important}
.tabs button>span{white-space:nowrap}
.lang button{padding:8px 13px!important;font-size:.85rem!important}
.install{background:var(--accent);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.install .btn{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
.install .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.install b{font-size:1.1rem}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.steps .num{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.ios-ico{display:inline-block;vertical-align:middle;width:30px;height:30px;border:2px solid var(--accent);border-radius:8px;padding:3px;margin:0 4px;background:var(--surface)}
.ios-ico svg{width:100%;height:100%;stroke:#0a84ff;fill:none;stroke-width:2}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{min-width:56px}
.pwrow{position:relative}
.pwrow .field{padding-right:84px!important}
.pwrow button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:38px;padding:4px 12px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;font-weight:600;cursor:pointer}
</style>

function linkify(x){return esc(x).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}
function paras(x){return String(x||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${linkify(p).replace(/\n/g,"<br>")}</p>`).join("")}
function fmtDate(d){try{return new Date(d).toLocaleDateString(LANG==="af"?"af-ZA":"en-ZA",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function ago(d){const s=(Date.now()-new Date(d))/1000;if(s<60)return t("justNow");if(s<3600)return Math.floor(s/60)+" "+t("minAgo");if(s<86400)return Math.floor(s/3600)+" "+t("hAgo");if(s<604800)return Math.floor(s/86400)+" "+t("dAgo");return fmtDate(d)}

function isAudio(u){return /\.(mp3|m4a|aac|wav|ogg)(\?|$)/i.test(u||"")}
function isImage(u){return /\.(png|jpe?g|gif|webp)(\?|$)/i.test(u||"")}

/* ================= DATA: Supabase ================= */
function supabaseApi(){
  const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const chk=({data,error})=>{if(error)throw error;return data};
  let uid=null;
  return {
    onAuth(cb){sb.auth.onAuthStateChange((ev,session)=>{uid=session?session.user.id:null;cb(ev,session)})},
    async session(){const {data}=await sb.auth.getSession();uid=data.session?data.session.user.id:null;return data.session},
    async signUp(name,email,pw){const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;return !!data.session},
    async signIn(email,pw){chk(await sb.auth.signInWithPassword({email,password:pw}))},
    async signOut(){await sb.auth.signOut()},
    async resetPassword(email){chk(await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}))},
    async setPassword(pw){chk(await sb.auth.updateUser({password:pw}))},
    async me(){return chk(await sb.from("profiles").select("*").eq("id",uid).maybeSingle())},
    myId:()=>uid,
    async listPosts(kind,page){let q=sb.from("posts").select("*, profiles(full_name), comments(count)").order("pinned",{ascending:false}).order("week_of",{ascending:false}).order("created_at",{ascending:false}).range(page*PAGE,page*PAGE+PAGE-1);if(kind!=="all")q=q.eq("kind",kind);return chk(await q).map(p=>({...p,comment_count:(p.comments&&p.comments[0]&&p.comments[0].count)||0}))},
    async getPost(id){return chk(await sb.from("posts").select("*, profiles(full_name)").eq("id",id).maybeSingle())},
    async savePost(id,d){if(id)return chk(await sb.from("posts").update(d).eq("id",id).select().single());return chk(await sb.from("posts").insert(d).select().single())},
    async deletePost(id){chk(await sb.from("posts").delete().eq("id",id))},
    async upload(file){const path=Date.now()+"-"+file.name.replace(/[^\w.\-]+/g,"_");chk(await sb.storage.from("media").upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type||undefined}));return {url:sb.storage.from("media").getPublicUrl(path).data.publicUrl,name:file.name}},
    async listComments(pid){return chk(await sb.from("comments").select("*, profiles(full_name)").eq("post_id",pid).order("created_at"))},
    async addComment(pid,body){chk(await sb.from("comments").insert({post_id:pid,body}))},
    async deleteComment(id){chk(await sb.from("comments").delete().eq("id",id))},
    async listPrayers(answered,page){return chk(await sb.from("prayers").select("*, profiles(full_name), prayer_support(user_id)").eq("answered",answered).order("created_at",{ascending:false}).range(page*PAGE,page*PAGE+PAGE-1))},
    async addPrayer(d){chk(await sb.from("prayers").insert(d))},
    async updatePrayer(id,d){chk(await sb.from("prayers").update(d).eq("id",id))},
    async deletePrayer(id){chk(await sb.from("prayers").delete().eq("id",id))},
    async pray(id,on){if(on)chk(await sb.from("prayer_support").insert({prayer_id:id}));else chk(await sb.from("prayer_support").delete().eq("prayer_id",id).eq("user_id",uid))},
    async listMembers(){return chk(await sb.from("profiles").select("*").order("status").order("created_at",{ascending:false}))},
    async updateMember(id,d){chk(await sb.from("profiles").update(d).eq("id",id))},
    async removeMember(id){chk(await sb.from("profiles").delete().eq("id",id))},
    async pendingCount(){const {count,error}=await sb.from("profiles").select("id",{count:"exact",head:true}).eq("status","pending");if(error)return 0;return count||0}
  };
}

/* ================= RENDER ================= */
let seq=0;
async function render(){
  const s=++seq;const v=$("#view");applyStatic();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===R.tab?"true":"false"));
  if(R.install){v.innerHTML=viewInstall();return}
  if(!ME||ME.status!=="approved"){if(R.screen&&R.screen.type==="pending")v.innerHTML=viewPending();else if(R.screen&&R.screen.type==="auth")v.innerHTML=viewAuth(R.screen.msg,R.screen.isErr);return}
  let h;
  try{
    if(R.tab==="feed")h=R.view==="post"?await viewPost():R.view==="edit"?await viewEdit():viewFeed();
    else if(R.tab==="prayer")h=viewPrayer();
    else if(R.tab==="admin")h=R.view==="edit"?await viewEdit():await viewAdmin();
    else h=viewMe();
  }catch(e){h=`<div class="err">${esc(friendly(e))}</div><button class="btn" style="margin-top:10px" data-act="retry">${t("tryAgain")}</button>`}
  if(s!==seq)return;v.innerHTML=h;
}
async function refreshBadge(){if(ME&&ME.role==="admin"){try{const n=await api.pendingCount();$("#pendingBadge").innerHTML=n?`<span class="badge">${n}</span>`:""}catch(e){}}}

async function boot(){
  $("#brand").textContent=(CFG.appName||"AGS Jubelate").toUpperCase();document.title=CFG.appName||"AGS Jubelate";
  setupLogo();applyStatic();
  if(R.recovery){$("#tabs").hidden=true;R.auth="newpw";$("#view").innerHTML=viewAuth();return}
  const sess=await api.session();
  if(!sess){ME=null;$("#tabs").hidden=true;$("#view").innerHTML=viewAuth();return}
  try{ME=await api.me()}catch(e){ME=null}
  if(!ME||ME.status!=="approved"){$("#tabs").hidden=true;$("#view").innerHTML=viewPending();return}
  R.screen=null;$("#tabs").hidden=false;$("#adminTab").hidden=ME.role!=="admin";
  try{await Promise.all([loadFeed(true),loadPrayers(true)])}catch(e){}
  refreshBadge();render();
}

document.addEventListener("click",async e=>{
  const el=e.target.closest("button,[data-post]");if(!el)return;const ds=el.dataset;
  try{
    if(ds.lang){LANG=ds.lang;try{localStorage.setItem("jubelate-lang",LANG)}catch(x){}render();return}
    if(ds.auth){R.auth=ds.auth;$("#view").innerHTML=viewAuth();return}
    if(ds.tab){if(ds.tab==="prayer")await loadPrayers(true);if(ds.tab==="feed"&&R.tab==="feed"){await loadFeed(true)}go({tab:ds.tab,view:"list"});if(ds.tab==="admin")refreshBadge();return}
    if(ds.kind){R.kind=ds.kind;await loadFeed(true);render();return}
    if(ds.post){go({tab:"feed",view:"post",postId:+ds.post});return}
    if(ds.edit){go({view:"edit",editId:+ds.edit});return}
    if(ds.delpost){if(el.dataset.sure){await api.deletePost(+ds.delpost);toast(t("postDeleted"));await loadFeed(true);go({tab:"feed",view:"list"})}else{el.dataset.sure=1;el.textContent=t("tapAgainDel")}return}
    if(ds.delcomment){await api.deleteComment(+ds.delcomment);render();return}
    if(ds.answered!==undefined){R.answered=ds.answered==="1";await loadPrayers(true);render();return}
    if(ds.pray){el.disabled=true;await api.pray(+ds.pray,ds.on!=="1");await loadPrayers(true);render();return}
    if(ds.answer){await api.updatePrayer(+ds.answer,{answered:true});toast(t("praiseGod"));await loadPrayers(true);render();return}
    if(ds.delprayer){if(el.dataset.sure){await api.deletePrayer(+ds.delprayer);await loadPrayers(true);render()}else{el.dataset.sure=1;el.textContent=t("tapAgainDel")}return}
    if(ds.mem){el.disabled=true;await api.updateMember(ds.mem,JSON.parse(ds.set));toast(t("updated"));refreshBadge();render();return}
    if(ds.memdel){if(el.dataset.sure){await api.removeMember(ds.memdel);toast(t("declined"));refreshBadge();render()}else{el.dataset.sure=1;el.textContent=t("tapAgain")}return}
    if(ds.size!==undefined){TEXTSIZE=ds.size;try{localStorage.setItem("jubelate-size",TEXTSIZE)}catch(x){}applySize();render();return}
    const a=ds.act;if(!a)return;
    if(a==="install"){if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r&&r.outcome==="accepted")toast(t("installDone"));render()}else{R.install=true;render();window.scrollTo(0,0)}return}
    if(a==="howinstall"){R.install=true;render();window.scrollTo(0,0);return}
    if(a==="closeinstall"){R.install=false;render();return}
    if(a==="installlater"){try{localStorage.setItem("jubelate-install-later",new Date().toDateString())}catch(x){}render();return}
    if(a==="copylink"){const u=location.href.split("#")[0];try{await navigator.clipboard.writeText(u);toast(t("copied"))}catch(x){prompt("",u)}return}
    if(a==="togglepw"){const f=$("#aPw");if(f){const show=f.type==="password";f.type=show?"text":"password";el.textContent=show?t("hide"):t("show")}return}
    if(a==="back"){go({view:R.view==="edit"&&R.editId?"post":"list",postId:R.editId||R.postId,editId:null});return}
    if(a==="newpost"){go({view:"edit",editId:null});return}
    if(a==="morefeed"){await loadFeed(false);render();return}
    if(a==="morepray"){await loadPrayers(false);render();return}
    if(a==="signout"){if(api.demo){toast(t("demoSignout"));return}await api.signOut();ME=null;boot();return}
    if(a==="recheck"){boot();return}
    if(a==="retry"){render();return}
    if(a==="changepw"){R.recovery=true;boot();return}
  }catch(err){toast(friendly(err))}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="authForm")return submitAuth(e);
  if(e.target.id==="postForm")return submitPost(e);
  e.preventDefault();
  try{
    if(e.target.id==="commentForm"){const b=$("#cBody").value.trim();if(!b)return;e.target.querySelector("button").disabled=true;await api.addComment(R.postId,b);await loadFeed(true);render()}
    if(e.target.id==="prayerForm"){const title=$("#prTitle").value.trim();if(!title){$("#prErr").innerHTML=`<div class="err">${t("needRequest")}</div>`;return}
      await api.addPrayer({title,body:$("#prBody").value.trim(),visibility:$("#prVis").value});toast(t("prayerShared"));R.answered=false;await loadPrayers(true);render()}
  }catch(err){toast(friendly(err))}
});

if(!DEMO)api.onAuth(ev=>{if(ev==="PASSWORD_RECOVERY"){R.recovery=true;boot()}});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
</body>
</html>
